[project]
name = "quant-consensus"
version = "0.1.0"
description = "Sistema para consolidar carteiras recomendadas de ações"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.14.4",
    "duckdb",
    "loguru",
    "pandas",
    "pyarrow",
    "requests",
    "tomli>=2.4.1 ; python_full_version < '3.11'",
    "trafilatura",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs<2.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D", "BLE", "FURB", "DTZ"]
ignore = ["D203", "D212", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
